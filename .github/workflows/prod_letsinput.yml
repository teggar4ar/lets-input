# Nama workflow
name: Build and Deploy Laravel App to Azure Web App - letsinput

# Pemicu workflow
on:
  push:
    branches:
      - prod # Ganti dengan nama branch production Anda, misal: main
  workflow_dispatch:

# Definisi Jobs
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Environment variables bisa digunakan untuk menyederhanakan perintah
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      # 1. Checkout kode dari repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup PHP versi 8.3
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, mysql

      # 3. Setup Node.js untuk build aset frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # atau versi LTS terbaru yang Anda gunakan
          cache: 'npm'

      # 4. Copy file .env.example sebagai dasar (jika file .env tidak ada)
      - name: Copy .env file
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      # 5. Install dependensi Composer (mode produksi)
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-dev

      # 6. Install dependensi NPM
      - name: Install NPM dependencies
        run: npm install

      # 7. Build aset frontend (CSS/JS)
      - name: Build frontend assets
        run: npm run build

      # # 8. Generate Application Key Laravel
      # - name: Generate Laravel Application Key
      #   run: php artisan key:generate

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'letsinput'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B8BA7F40807141B29064C1EB9D99F0CE }}
